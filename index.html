<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Simulação Empréstimo</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="theme-color" content="#F7F6F2" id="metaTema">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Empréstimo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
// Aplica o tema escolhido antes de desenhar a tela (evita piscar)
try { var t = localStorage.getItem('tema'); if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-theme', t === 'claro' ? 'light' : 'dark'); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* TEMA CLARO (padrão) */
:root {
  --bg: #F7F6F2; --surface: #FFFFFF; --ink: #141414; --muted: #6E6A62;
  --line: #141414; --soft: #E4E1D9; --gold: #EBB533; --gold-ink: #8A6508;
  --on-gold: #141414; --red: #C2410C; --shadow: #141414;
  --logo-claro: block; --logo-escuro: none;
}
/* TEMA ESCURO: segue o sistema, a não ser que tenha forçado o claro */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --surface: #1C1B19; --ink: #F4F1E8; --muted: #9A958A;
    --line: #F4F1E8; --soft: #2C2A26; --gold: #EBB533; --gold-ink: #EBB533;
    --on-gold: #141414; --red: #F28B5B; --shadow: #EBB533;
    --logo-claro: none; --logo-escuro: block;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --surface: #1C1B19; --ink: #F4F1E8; --muted: #9A958A;
  --line: #F4F1E8; --soft: #2C2A26; --gold: #EBB533; --gold-ink: #EBB533;
  --on-gold: #141414; --red: #F28B5B; --shadow: #EBB533;
  --logo-claro: none; --logo-escuro: block;
}

html { background: var(--bg); }
body {
  background: var(--bg); color: var(--ink); font-family: 'Barlow', sans-serif;
  min-height: 100vh; max-width: 520px; margin: 0 auto;
  padding: env(safe-area-inset-top) 16px calc(110px + env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* TOPO */
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 14px; }
.logo { height: 60px; width: auto; }
.logo-claro { display: var(--logo-claro); }
.logo-escuro { display: var(--logo-escuro); }
.topo-btns { display: flex; gap: 8px; }
.hbtn {
  height: 44px; min-width: 44px; padding: 0 10px; border: 2px solid var(--line); border-radius: 10px;
  background: var(--surface); font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 3px 3px 0 var(--shadow); transition: transform .08s, box-shadow .08s;
}
.hbtn:active, .btn-clear:active, .abtn:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--shadow); }
.hbtn .tema-txt { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 1px; padding-top: 2px; }

h1 {
  font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 44px; line-height: .9;
  letter-spacing: .5px; border-top: 4px solid var(--line); padding-top: 12px; margin-bottom: 18px;
}
h1 span { display: block; color: var(--gold-ink); }

/* ABAS */
.abas { display: grid; grid-template-columns: 1fr 1fr; border: 3px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
.aba { border: 0; background: var(--surface); color: var(--muted); padding: 11px 6px 9px; font-size: 15px; font-weight: 700; cursor: pointer; }
.aba + .aba { border-left: 3px solid var(--line); }
.aba.on { background: var(--ink); color: var(--bg); }

/* CAMPO DE VALOR */
.campo-label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.input-row { display: flex; align-items: stretch; gap: 10px; }
.campo {
  flex: 1; display: flex; align-items: baseline; gap: 8px; min-width: 0;
  border: 3px solid var(--line); border-radius: 12px; background: var(--surface); padding: 6px 14px 2px;
  box-shadow: 5px 5px 0 var(--gold);
}
.campo:focus-within { box-shadow: 5px 5px 0 var(--shadow); }
.campo .rs { font-family: 'Bebas Neue', sans-serif; font-size: 30px; color: var(--muted); }
.field-input {
  flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--ink);
  font-family: 'Bebas Neue', sans-serif; font-size: 56px; line-height: 1.05; letter-spacing: 1px;
  -webkit-appearance: none;
}
.field-input::placeholder { color: var(--soft); }
.btn-clear {
  width: 62px; flex-shrink: 0; border: 3px solid var(--line); border-radius: 12px;
  background: var(--surface); font-size: 24px; cursor: pointer; box-shadow: 5px 5px 0 var(--shadow);
  transition: transform .08s, box-shadow .08s;
}

/* TABELA */
.vazio { margin-top: 28px; color: var(--muted); font-size: 15px; line-height: 1.5; }
.result { margin-top: 26px; border: 3px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.res-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  background: var(--gold); color: var(--on-gold); padding: 10px 14px 8px; border-bottom: 3px solid var(--line);
}
.res-head b { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 26px; letter-spacing: .5px; }
.res-head small { font-size: 13px; font-weight: 700; }
.rc-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rc-table th {
  font-size: 12px; font-weight: 700; color: var(--muted); text-align: right;
  padding: 10px 12px 6px; border-bottom: 2px solid var(--soft);
}
.rc-table th:first-child, .rc-table td:first-child { text-align: left; }
.rc-table td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--soft); vertical-align: baseline; }
.rc-table tr:last-child td { border-bottom: 0; }
.td-parc { font-family: 'Bebas Neue', sans-serif; font-size: 28px; line-height: 1; color: var(--gold-ink); width: 1%; white-space: nowrap; }
.td-vparcela { font-size: 18px; font-weight: 800; white-space: nowrap; }
.td-total { font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.td-juros { font-size: 13px; font-weight: 600; color: var(--red); white-space: nowrap; }

/* BOTÃO COPIAR (fixo embaixo) */
.action-btns {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.abtn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; max-width: 488px; margin: 0 auto; padding: 14px 16px 11px;
  border: 3px solid var(--line); border-radius: 12px; background: var(--gold); color: var(--on-gold);
  font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1.5px; cursor: pointer;
  box-shadow: 5px 5px 0 var(--line); transition: transform .08s, box-shadow .08s;
}
.abtn:active { box-shadow: 0 0 0 var(--line); transform: translate(5px,5px); }

/* AVISO */
.toast {
  position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 20;
  transform: translateX(-50%) translateY(16px); opacity: 0; pointer-events: none; white-space: nowrap;
  background: var(--ink); color: var(--bg); border: 2px solid var(--gold);
  padding: 11px 22px; border-radius: 10px; font-size: 15px; font-weight: 700; transition: all .25s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 360px) {
  .field-input { font-size: 46px; }
  .td-vparcela { font-size: 16px; }
  .rc-table td, .rc-table th { padding-left: 8px; padding-right: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <img class="logo logo-claro" src="logo-claro.png" alt="Zicão Store" width="900" height="397">
  <img class="logo logo-escuro" src="logo-escuro.png" alt="Zicão Store" width="900" height="397">
  <div class="topo-btns">
    <button class="hbtn" id="btnTema" onclick="trocarTema()" title="Trocar tema"><span id="temaIcone">◐</span><span class="tema-txt" id="temaTxt">AUTO</span></button>
    <button class="hbtn" onclick="copiarWhats()" title="Copiar para WhatsApp" aria-label="Copiar para WhatsApp">📋</button>
  </div>
</header>

<h1>Simulação de<span>empréstimo</span></h1>

<div class="abas" role="tablist">
  <button class="aba on" id="abaReceber" role="tab" onclick="trocarModo('receber')">Quero receber</button>
  <button class="aba" id="abaLimite" role="tab" onclick="trocarModo('limite')">Tenho de limite</button>
</div>

<label class="campo-label" id="campoLabel" for="valorInput">Valor que o cliente quer receber</label>
<div class="input-row">
  <div class="campo">
    <span class="rs">R$</span>
    <input class="field-input" id="valorInput" type="text" inputmode="decimal" autocomplete="off" placeholder="1.000" oninput="calcular()">
  </div>
  <button class="btn-clear" onclick="limpar()" title="Limpar" aria-label="Limpar">🗑️</button>
</div>

<div id="resultArea"><p class="vazio">Digite o valor pra ver as parcelas de 1x a 18x.</p></div>

<div class="action-btns" id="actionBtns" style="display:none">
  <button class="abtn" onclick="copiarWhats()">📋 Copiar para WhatsApp</button>
</div>

<div class="toast" id="toast" role="status">✅ Texto copiado!</div>

<script>
const FATORES = {
   1: 0.92358333,
   2: 0.46591667,
   3: 0.31276667,
   4: 0.23619167,
   5: 0.19026667,
   6: 0.15964167,
   7: 0.13807500,
   8: 0.12164167,
   9: 0.10886667,
  10: 0.09865000,
  11: 0.09029167,
  12: 0.08333333,
  13: 0.07815833,
  14: 0.07307500,
  15: 0.06866667,
  16: 0.06481667,
  17: 0.06141667,
  18: 0.05840833,
};

const VAZIO = '<p class="vazio">Digite o valor pra ver as parcelas de 1x a 18x.</p>';
const fmt = v => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let valAtual = 0;
let modo = 'receber'; // 'receber' ou 'limite'

// Monta as 18 linhas da simulação. Usada pela tabela da tela e pelo texto do WhatsApp.
// cobrado = recebido × 1,20; parcela = cobrado × fator, arredondada nos centavos
// (é o que a maquininha cobra), e o total é parcela × vezes.
function simular(valor) {
  const cobrado = valor * 1.20;
  const linhas = [];
  for (let n = 1; n <= 18; n++) {
    const parcela = Math.round(cobrado * FATORES[n] * 100) / 100;
    const total = parcela * n;
    linhas.push({ n: n, parcela: parcela, total: total, juros: total - valor });
  }
  return linhas;
}

// Simulação reversa: o cliente tem X de limite (o que vai passar no cartão).
// Pra cada vez: recebido = limite ÷ (1,20 × fator × vezes), cortado nos centavos,
// e confere pela regra do simular que o total cabe no limite.
function reverso(limite) {
  const linhas = [];
  for (let n = 1; n <= 18; n++) {
    const totalDe = function (r) { return simular(r)[n - 1].total; };
    let r = Math.floor(limite / (1.20 * FATORES[n] * n) * 100) / 100;
    while (r > 0 && totalDe(r) > limite + 0.001) r = Math.round((r - 0.01) * 100) / 100;
    const l = simular(r)[n - 1];
    linhas.push({ n: n, recebe: r, parcela: l.parcela, total: l.total });
  }
  return linhas;
}

// Lê o que foi digitado aceitando o jeito brasileiro: "1500", "1.500", "1500,50", "1.500,50".
// Devolve 0 se não for um valor válido maior que zero.
function lerValor(txt) {
  txt = String(txt).replace(/[^0-9.,]/g, '');
  if (txt.indexOf(',') >= 0) txt = txt.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(txt)) txt = txt.replace(/\./g, '');
  const v = parseFloat(txt);
  return isFinite(v) && v > 0 ? v : 0;
}

function calcular() {
  const val = lerValor(document.getElementById('valorInput').value);
  valAtual = val;
  const area = document.getElementById('resultArea');
  const btns = document.getElementById('actionBtns');

  if (!val || val <= 0) {
    area.innerHTML = VAZIO;
    btns.style.display = 'none';
    return;
  }

  if (modo === 'limite') {
    const rowsL = reverso(val).map(function (l) {
      return '<tr>' +
        '<td class="td-parc">' + l.n + 'x</td>' +
        '<td class="td-vparcela">R$ ' + fmt(l.recebe) + '</td>' +
        '<td class="td-total">R$ ' + fmt(l.parcela) + '</td>' +
        '</tr>';
    }).join('');
    area.innerHTML =
      '<div class="result">' +
        '<div class="res-head"><b>Passando R$ ' + fmt(val) + '</b><small>Até 18x</small></div>' +
        '<table class="rc-table">' +
          '<thead><tr><th>Vezes</th><th>Cliente pega</th><th>Parcela</th></tr></thead>' +
          '<tbody>' + rowsL + '</tbody>' +
        '</table>' +
      '</div>';
    btns.style.display = 'block';
    return;
  }

  const rows = simular(val).map(function (l) {
    return '<tr>' +
      '<td class="td-parc">' + l.n + 'x</td>' +
      '<td class="td-vparcela">R$ ' + fmt(l.parcela) + '</td>' +
      '<td class="td-total">R$ ' + fmt(l.total) + '</td>' +
      '<td class="td-juros">+' + fmt(l.juros) + '</td>' +
      '</tr>';
  }).join('');

  area.innerHTML =
    '<div class="result">' +
      '<div class="res-head"><b>Recebe R$ ' + fmt(val) + '</b><small>Até 18x</small></div>' +
      '<table class="rc-table">' +
        '<thead><tr><th>Vezes</th><th>Parcela</th><th>Total</th><th>Juros</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
    '</div>';

  btns.style.display = 'block';
}

function trocarModo(m) {
  modo = m;
  document.getElementById('abaReceber').classList.toggle('on', m === 'receber');
  document.getElementById('abaLimite').classList.toggle('on', m === 'limite');
  document.getElementById('campoLabel').textContent = m === 'limite'
    ? 'Limite do cartão (valor que vai passar)' : 'Valor que o cliente quer receber';
  calcular();
  document.getElementById('valorInput').focus();
}

function gerarTextoLimite() {
  const linhas = reverso(valAtual).map(function (l) {
    return { n: l.n, r: fmt(l.recebe), p: fmt(l.parcela) };
  });
  const colR = Math.max(6, Math.max.apply(null, linhas.map(function(l){ return l.r.length; })));
  const colP = Math.max(7, Math.max.apply(null, linhas.map(function(l){ return l.p.length; })));

  var t = '*\u{1F4B3} SIMULAÇÃO DE EMPRÉSTIMO*\n\n';
  t += '*\u{1F4B3} Passando no cartão: R$ ' + fmt(valAtual) + '*\n\n';
  t += '```\n';
  t += 'Px.   ' + 'Recebe'.padStart(colR) + '     ' + 'Parcela'.padStart(colP) + '\n';
  t += '\u2500'.repeat(6 + colR + 5 + colP) + '\n';
  for (var i = 0; i < linhas.length; i++) {
    var l = linhas[i];
    t += String(l.n).padStart(2,'0') + 'x   ' + l.r.padStart(colR) + '  \u2502  ' + l.p.padStart(colP) + '\n';
  }
  t += '```';
  return t;
}

function gerarTexto() {
  if (!valAtual) return '';
  if (modo === 'limite') return gerarTextoLimite();
  const linhas = simular(valAtual).map(function (l) {
    return { n: l.n, p: fmt(l.parcela), total: fmt(l.total) };
  });
  // Colunas com largura fixa (o WhatsApp mostra ``` em fonte monoespaçada)
  const colP = Math.max(7, Math.max.apply(null, linhas.map(function(l){ return l.p.length; })));
  const colT = Math.max(5, Math.max.apply(null, linhas.map(function(l){ return l.total.length; })));

  var t = '*\u{1F4B3} SIMULAÇÃO DE EMPRÉSTIMO*\n\n';
  t += '*\u{1F4B5} Valor recebido: R$ ' + fmt(valAtual) + '*\n\n';
  t += '```\n';
  t += 'Px.   ' + 'Parcela'.padStart(colP) + '     ' + 'Total'.padStart(colT) + '\n';
  t += '\u2500'.repeat(6 + colP + 5 + colT) + '\n';
  for (var i = 0; i < linhas.length; i++) {
    var l = linhas[i];
    t += String(l.n).padStart(2,'0') + 'x   ' + l.p.padStart(colP) + '  \u2502  ' + l.total.padStart(colT) + '\n';
  }
  t += '```';
  return t;
}

var toastTimer;
function mostrarToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer); // vários toques seguidos não fazem o aviso sumir antes da hora
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2500);
}

// Jeito antigo de copiar: usado quando o navegador recusa o navigator.clipboard
function copiaAntiga(txt) {
  var ta = document.createElement('textarea');
  ta.value = txt;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, txt.length); // necessário no iPhone
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  mostrarToast(ok ? '✅ Texto copiado!' : '⚠️ Não copiou, tente de novo');
}

function copiarWhats() {
  var txt = gerarTexto();
  if (!txt) { mostrarToast('Digite um valor primeiro'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(
      function(){ mostrarToast('✅ Texto copiado!'); },
      function(){ copiaAntiga(txt); }
    );
  } else {
    copiaAntiga(txt);
  }
}

function limpar() {
  document.getElementById('valorInput').value = '';
  document.getElementById('resultArea').innerHTML = VAZIO;
  document.getElementById('valorInput').focus();
  document.getElementById('actionBtns').style.display = 'none';
  valAtual = 0;
}

// TEMA: auto (segue o Mac/iPhone) → claro → escuro → auto
var TEMAS = { auto: ['◐', 'AUTO'], claro: ['☀️', 'CLARO'], escuro: ['🌙', 'ESCURO'] };
var temaAtual = 'auto';
try { temaAtual = localStorage.getItem('tema') || 'auto'; } catch (e) {}
if (!TEMAS[temaAtual]) temaAtual = 'auto';
var sistemaEscuro = window.matchMedia('(prefers-color-scheme: dark)');

function aplicarTema() {
  var html = document.documentElement;
  if (temaAtual === 'auto') html.removeAttribute('data-theme');
  else html.setAttribute('data-theme', temaAtual === 'claro' ? 'light' : 'dark');
  var escuro = temaAtual === 'escuro' || (temaAtual === 'auto' && sistemaEscuro.matches);
  document.getElementById('metaTema').setAttribute('content', escuro ? '#121211' : '#F7F6F2');
  document.getElementById('temaIcone').textContent = TEMAS[temaAtual][0];
  document.getElementById('temaTxt').textContent = TEMAS[temaAtual][1];
}
function trocarTema() {
  temaAtual = temaAtual === 'auto' ? 'claro' : temaAtual === 'claro' ? 'escuro' : 'auto';
  try { localStorage.setItem('tema', temaAtual); } catch (e) {}
  aplicarTema();
}
if (sistemaEscuro.addEventListener) sistemaEscuro.addEventListener('change', aplicarTema);
aplicarTema();

// Guarda o app no celular pra abrir sem internet (ver sw.js)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
}
</script>
</body>
</html>
